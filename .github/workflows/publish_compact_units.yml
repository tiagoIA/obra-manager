name: Verify and publish compact unit details
on:
  push:
    branches: [fix/compact-unit-details-2026-10-12]
    paths: [.github/workflows/publish_compact_units.yml, public/index.html, scripts/publish_compact_units.py]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-ui.cjs
      - run: TZ=America/New_York node scripts/check-schedule.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-compact-units.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python scripts/publish_compact_units.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-units-publication-${{ github.run_id }}
          path: hosting-test/
          if-no-files-found: ignore
          retention-days: 90
