name: Apply two reviewed CO material photos
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/apply-photo-co.yml]
permissions:
  contents: read
concurrency:
  group: obra-material-enrichment
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-auth google-cloud-storage requests pillow pymupdf
      - run: python scripts/apply-approved-photo-manifest.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PHOTO_MANIFEST: photo-coverage-co-approved.json
          PHOTO_EXPECTED_COUNT: '2'
