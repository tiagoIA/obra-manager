name: Verify and publish partial subtask progress
on:
  push:
    branches: [fix/subtask-progress-2026-10-15]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-partial-progress.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/consolidate_basement_support.py scripts/publish_progress.py
      - run: pip install google-auth requests google-cloud-storage google-cloud-firestore
      - name: Publish and verify progress percentages
        run: python scripts/publish_progress.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Consolidate shared support and verify preserved Basement scope
        run: python scripts/consolidate_basement_support.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-progress-verification-${{ github.run_id }}
          path: hosting-test/
          if-no-files-found: ignore
          retention-days: 30
