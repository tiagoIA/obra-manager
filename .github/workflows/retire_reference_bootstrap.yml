name: Retire stalled reference bootstrap validation
on:
  push:
    branches: [feature/installation-references-2026-10-22]
    paths: [.github/workflows/retire_reference_bootstrap.yml]
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel only the superseded bootstrap run
        env:
          REFERENCE_ACTION_TOKEN: ${{ github.token }}
          REFERENCE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base='https://api.github.com/repos/'+os.environ['REFERENCE_REPOSITORY']+'/actions/runs/39842270704'
          headers={'Authorization':'Bearer '+os.environ['REFERENCE_ACTION_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          run=json.load(urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30))
          if run['head_sha']!='3ebdde6f68c6ea0422ed77af999397788044cd6c' or run['head_branch']!='feature/installation-references-2026-10-22':
              raise SystemExit('Unexpected run; refusing cancellation')
          if run['status']!='completed':
              with urllib.request.urlopen(urllib.request.Request(base+'/cancel',headers=headers,method='POST'),timeout=30) as response:
                  print('Superseded validation cancellation requested:',response.status)
          else: print('Superseded validation already completed')
          PY
