name: Collect existing material references
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/enrich-materials.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: pip install requests pillow
      - name: Match exact existing models in public distributor feed
        run: |
          python - <<'PY'
          import requests,io,hashlib,base64,json
          from PIL import Image
          u='https://www.mersen.com/sites/default/files/styles/article/public/medias/PIM/images/PHP-TRS15R-Mersen-TIMG.jpg.webp?itok=9x6l2tvc'
          r=requests.get(u,timeout=40);r.raise_for_status();im=Image.open(io.BytesIO(r.content));im.load();assert min(im.size)>=80;im=im.convert('RGB');im.thumbnail((1000,1000));b=io.BytesIO();im.save(b,'JPEG',quality=86);print('EXACT_PHOTO_SHA',hashlib.sha256(b.getvalue()).hexdigest());print('EXACT_PHOTO',base64.b64encode(b.getvalue()).decode())
          
          PY
