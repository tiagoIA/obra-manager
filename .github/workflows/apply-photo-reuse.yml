name: Apply reviewed material photo references
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/apply-photo-reuse.yml]
permissions:
  contents: read
concurrency:
  group: obra-material-enrichment
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-auth google-cloud-storage requests pillow
      - run: python scripts/apply-photo-reuse.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
