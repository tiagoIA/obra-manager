name: Audit lifecycle and supplier usage
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/audit-central.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install google-auth requests beautifulsoup4
      - name: Read existing catalog and public product markup
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import os,json,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          k=json.loads(os.environ['FIREBASE_SA']);assert k['project_id']=='obra-manager-4ecc7'
          s=AuthorizedSession(service_account.Credentials.from_service_account_info(k,scopes=['https://www.googleapis.com/auth/cloud-platform']))
          base='https://firestore.googleapis.com/v1/projects/obra-manager-4ecc7/databases/(default)/documents/'
          def dec(v):
            for key in ['stringValue','integerValue','doubleValue','booleanValue','nullValue']:
              if key in v:return v[key]
            if 'arrayValue' in v:return [dec(x) for x in v['arrayValue'].get('values',[])]
            if 'mapValue' in v:return {key:dec(x) for key,x in v['mapValue'].get('fields',{}).items()}
            return None
          for col in ['materials','shoppingItems','tasks','productDB','invoiceItems','invoices']:
            docs=[];token=None
            while True:
              params={'pageSize':1000}
              if token:params['pageToken']=token
              r=s.get(base+col,params=params,timeout=60);r.raise_for_status();d=r.json();docs+=d.get('documents',[])
              token=d.get('nextPageToken')
              if not token:break
            print('COLLECTION',col,len(docs))
            for d in docs:
              f={key:dec(v) for key,v in d.get('fields',{}).items()}
              if col=='materials':
                out={'id':d['name'].split('/')[-1],**{key:f.get(key) for key in ['name','sku','brand','manufacturerPart','model','upc','cat','isTask','subcategory','suppliers','gceCode','catalogCode','description','specs','recordType','unit','sourceUrl','qty','active','status','recordType','importBatch']},'photo':bool(f.get('photoUrl'))}
                print('CATALOG_ROW',json.dumps(out,ensure_ascii=False))
              else:print('LINK_ROW',col,json.dumps({key:f.get(key) for key in ['supplier','supplierName','vendor','vendorName','company','code','materialId','matId','qty','description']},ensure_ascii=False))
          PY

# Refresh active photo backlog after lifecycle release.
