name: Publish verified English material lifecycle
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/publish-lifecycle.yml]
permissions:
  contents: read
concurrency:
  group: obra-material-enrichment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-vm-modules tests/app-syntax.cjs
      - run: node tests/catalog-legacy-identities.cjs
      - run: node tests/central-catalog.cjs
      - run: node tests/guided-shopping.cjs
      - run: python tests/lifecycle-migration.py
      - run: pip install google-auth google-cloud-storage requests pillow
      - name: Back up and migrate reviewed materials and templates
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CATALOG_MANIFEST: catalog-variants-v2.json
        run: python scripts/apply-lifecycle.py
      - name: Back up and publish the verified interface
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/publish-lifecycle.py
