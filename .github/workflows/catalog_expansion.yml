name: Audit and import electrical catalog expansion
on:
  push:
    branches: [work/catalog-expansion-2026-10-16]
    paths: [scripts/import_catalog_expansion.py, catalog-expansion/prepared-products.json.gz, catalog-expansion/import-manifest.json, .github/workflows/catalog_expansion.yml]
permissions:
  contents: read
concurrency:
  group: obra-manager-product-catalog-expansion
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Native product and mobile/desktop tests passed in run 38904694520.
      # Candidate digest is unchanged; the importer rechecks identity and source constraints.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install firebase-admin
      - run: python scripts/import_catalog_expansion.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IMPORT_LIMIT: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-expansion-result
          path: |
            catalog-import-result.json
            catalog-import-created-ids.json
            hosting-test/
          retention-days: 14
