name: Verify and publish optional project work types
on:
  push:
    branches: [feature/optional-work-types-2026-10-15]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-report-titles.cjs
      - run: node scripts/check-work-types.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python scripts/publish_work_types.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-types-verification-${{ github.run_id }}
          path: hosting-test/
          if-no-files-found: ignore
          retention-days: 30
