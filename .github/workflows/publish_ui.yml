name: Publish verified Home and photo fixes
on:
  push:
    branches: [fix/home-photo-zoom-2026-10-09]
    paths: [.github/workflows/publish_ui.yml, public/index.html, scripts/publish_ui.py]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-ui.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python scripts/publish_ui.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-ui-publication-${{ github.run_id }}
          path: hosting-test/
          if-no-files-found: ignore
          retention-days: 90
