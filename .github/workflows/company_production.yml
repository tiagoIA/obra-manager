name: Validate and provision company backend in existing project
on:
  push:
    branches: [feature/company-production-2026-10-17]
    paths: [pilot/**, .github/workflows/company_production.yml]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: pilot
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: pilot/functions
      - name: Validate registration, invites and company project isolation
        working-directory: pilot
        run: npx firebase emulators:exec --project demo-obra-company-pilot --only firestore 'node test-registration.mjs && node test-invitations.mjs && node test-projects.mjs'
      - name: Use existing authorized deployment identity
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PYSETUP'
          import json,os,pathlib
          key=json.loads(os.environ['FIREBASE_SA'])
          assert key.get('project_id')=='obra-manager-4ecc7'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'company-deploy.json'
          path.write_text(json.dumps(key));path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GOOGLE_APPLICATION_CREDENTIALS='+str(path)+'\n')
          print('Deployment identity:',key['client_email'])
          PYSETUP
      - name: Deploy company functions only, preserving existing codebases and all app assets
        working-directory: pilot
        run: npx firebase deploy --project obra-manager-4ecc7 --config firebase-production.json --only functions:company-workspace --non-interactive
      - name: Remove runner-only credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/company-deploy.json"
