name: Verify and publish additive photo report 2.0
on:
  push:
    branches: [fix/photo-report-2026-10-13]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-photo-report.cjs
      - name: Preserve existing workspace behavior
        run: |
          mkdir -p /tmp/photo-report-check/public
          cp public/app.html /tmp/photo-report-check/public/index.html
          cd /tmp/photo-report-check
          node --experimental-vm-modules "$GITHUB_WORKSPACE/scripts/check-ui.cjs"
          TZ=America/New_York node "$GITHUB_WORKSPACE/scripts/check-schedule.cjs"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-photo-report-browser.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests google-cloud-firestore
      - run: python scripts/snapshot_photo_report.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Enable image processing from the existing app origin
        run: python scripts/configure_report_image_cors.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node scripts/render_arlington_photo_report.cjs
      - run: python scripts/publish_photo_report.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Generate an Arlington PDF recovery artifact if native export fails
        if: failure()
        run: |
          python scripts/snapshot_photo_report.py
          node scripts/render_arlington_direct_pdf.cjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-report-verification-${{ github.run_id }}
          path: hosting-test/
          retention-days: 30
