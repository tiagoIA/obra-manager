name: Save requested basement lighting and receptacle steps
on:
  push:
    branches: [task/basement-details-2026-10-15]
    paths: [scripts/add_basement_details.py, .github/workflows/basement_details.yml]
permissions:
  contents: read
concurrency:
  group: obra-manager-requested-basement
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/add_basement_details.py
      - run: pip install google-cloud-storage google-cloud-firestore google-auth
      - name: Save and verify the requested task details
        run: python scripts/add_basement_details.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
