name: Stage electrical catalog supplement v3
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/stage-central.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: python scripts/collect-supplement.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-stage
          path: catalog-stage/
