name: Verify native Estimates workspace
on:
  push:
    branches: [feature/estimates-2026-10-17]
    paths: [public/estimates.js, public/app.html, tests/estimates*, scripts/*estimate*, .github/workflows/estimates.yml]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --input-type=module --check < public/estimates.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/estimates-browser.cjs
      - run: node --experimental-vm-modules tests/suggestions-core.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python scripts/check_estimate_rules.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: python scripts/publish_estimates.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estimates-review-${{ github.run_id }}
          path: hosting-test/
          retention-days: 7
