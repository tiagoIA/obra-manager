name: Review fastener and accessory variants
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/collect-variants.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: python scripts/collect-variants.py
