name: Review library photo references
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/review-photo-reuse-final.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-auth requests pillow
      - run: python scripts/review-photo-reuse-final.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
