name: Save verified Melrose progress
on:
  push:
    branches: [ops/melrose-progress-2026-10-16]
    paths: [.github/workflows/melrose_progress.yml]
permissions:
  contents: read
concurrency:
  group: melrose-progress-20261016
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-cloud-firestore google-cloud-storage cryptography
      - name: Save reported work and encrypted panel photo
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python ops/update_melrose.py

      - name: Inspect receptacle task and export public encryption key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.cloud import firestore
          from cryptography.hazmat.primitives import serialization
          k=json.loads(os.environ['FIREBASE_SA'])
          pk=serialization.load_pem_private_key(k['private_key'].encode(),None).public_key()
          print(pk.public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode())
          db=firestore.Client(project=k['project_id'],credentials=service_account.Credentials.from_service_account_info(k))
          tid='project-7316b60c7f14f0210e55cbd5-basement-task-02'
          d=db.collection('tasks').document(tid).get().to_dict()
          assert d and d['projectId']=='project-7316b60c7f14f0210e55cbd5'
          print('RECEPTACLE_TARGET',json.dumps({x:d.get(x) for x in ['name','projectId','roomId','done']}),'PHOTO_COUNT',len(d.get('photos',[])))
          PY
