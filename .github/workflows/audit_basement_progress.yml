name: Audit basement task structure
on:
  push:
    branches: [task/basement-details-2026-10-15]
    paths: [scripts/audit_basement_progress.py, .github/workflows/audit_basement_progress.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-cloud-storage google-cloud-firestore google-auth
      - run: python scripts/audit_basement_progress.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
