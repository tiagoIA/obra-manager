name: Validate production company data boundary
on:
  push:
    branches: [feature/company-production-2026-10-17]
    paths: [company-production/**, .github/workflows/company_boundary.yml]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: pilot
      - name: Verify old app and new companies cannot cross data boundaries
        working-directory: company-production
        run: ../pilot/node_modules/.bin/firebase emulators:exec --project demo-company-production --config firebase-test.json --only firestore,storage 'node rules-test.mjs'
