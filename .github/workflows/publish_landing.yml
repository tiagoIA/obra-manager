name: Verify and publish CrewNelo landing
on:
  push:
    branches: [feature/crewnelo-public-page-2026-10-13]
    paths: [public/**, scripts/publish_landing.py, scripts/check-landing.cjs, scripts/landing-publication.json, .github/workflows/publish_landing.yml]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check preserved workspace
        run: |
          mkdir -p /tmp/crewnelo-workspace-check/public
          cp public/app.html /tmp/crewnelo-workspace-check/public/index.html
          cd /tmp/crewnelo-workspace-check
          node --experimental-vm-modules "$GITHUB_WORKSPACE/scripts/check-ui.cjs"
          TZ=America/New_York node "$GITHUB_WORKSPACE/scripts/check-schedule.cjs"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-vm-modules scripts/check-landing.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python scripts/publish_landing.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crewnelo-landing-${{ github.run_id }}
          path: hosting-test/
          if-no-files-found: ignore
          retention-days: 30
