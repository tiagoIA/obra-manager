name: Review manufacturer material photos
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/collect-manufacturer-photos.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pillow pymupdf
      - run: python scripts/collect-manufacturer-photos.py
