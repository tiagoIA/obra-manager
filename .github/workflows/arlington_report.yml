name: Verify and publish Arlington report layout
on:
  push:
    branches: [fix/arlington-report-layout-2026-10-15]
    paths: [public/**, scripts/final-report-publication.json, scripts/link_arlington_identity.py, .github/workflows/arlington_report.yml]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-order.cjs
      - run: node --experimental-vm-modules scripts/check-photo-pdf-node.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-final-browser.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests google-cloud-firestore
      - run: python scripts/link_arlington_identity.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: python scripts/publish_final_report.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arlington-layout-review-${{ github.run_id }}
          path: |
            hosting-test/
            tmp/pdfs/
          retention-days: 7
