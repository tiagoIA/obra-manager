name: Collect product photos and online prices
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum product pages (0 = all registered supplier pages)'
        default: '0'
permissions:
  contents: read
concurrency:
  group: obra-manager-product-reference-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install firebase-admin
      - name: Collect exact references for review
        run: python scripts/bulk_photos.py --firestore --limit "$COLLECT_LIMIT" --output product-reference-candidates.json
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COLLECT_LIMIT: ${{ inputs.limit }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-reference-candidates
          path: product-reference-candidates.json
          retention-days: 7
