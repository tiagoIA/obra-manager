name: Fire alarm guided list
on:
  push:
    branches: [task/fire-alarm-guided-20261014]
    paths: ['scripts/fire_alarm_guided_20261014.py', 'scripts/check_fire_alarm_guided_20261014.cjs', '.github/workflows/fire_alarm_guided_20261014.yml']
permissions:
  contents: read
jobs:
  guided:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-cloud-firestore
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python scripts/fire_alarm_guided_20261014.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node scripts/check_fire_alarm_guided_20261014.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fire-alarm-guided-verification
          path: guided-verification/
          retention-days: 7
