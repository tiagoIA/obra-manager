name: Validate isolated company workspace
on:
  push:
    branches: [feature/company-workspace-2026-10-17]
    paths: [pilot/**, .github/workflows/company_workspace.yml]
permissions:
  contents: read
jobs:
  local-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: pilot
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: pilot/functions
      - name: Validate registration, invitations and consumption locally
        working-directory: pilot
        run: npx firebase emulators:exec --project demo-obra-company-pilot --only firestore 'node test-registration.mjs && node test-invitations.mjs && node test-projects.mjs && node test-consumption.mjs'
