name: Verify and publish direct photo PDF export
on:
  push:
    branches: [fix/direct-photo-pdf-2026-10-15]
permissions:
  contents: read
concurrency:
  group: obra-manager-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules scripts/check-report-titles.cjs
      - run: node --experimental-vm-modules scripts/check-photo-pdf-node.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-direct-photo-pdf.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests PyMuPDF
      - run: python scripts/check-photo-pdf-layout.py
      - run: python scripts/publish_direct_photo_pdf.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-photo-pdf-verification-${{ github.run_id }}
          path: |
            hosting-test/
            tmp/pdfs/
          if-no-files-found: ignore
          retention-days: 30
