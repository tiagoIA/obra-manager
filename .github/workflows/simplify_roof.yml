name: Simplify Roof scope
on:
  push:
    branches: [feature/purchasing-costs-2026-10-09]
    paths: ['scripts/simplify_arlington_roof.py', '.github/workflows/simplify_roof.yml']
permissions:
  contents: read
jobs:
  simplify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-cloud-firestore
      - run: python scripts/simplify_arlington_roof.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
