name: Verify second enrichment images
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/collect-enrichment-v2.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pillow pymupdf
      - run: python scripts/collect-enrichment-v2.py
