name: Audit and expand electrical boxes
on:
  push:
    branches: [work/catalog-expansion-2026-10-16]
    paths: [.github/workflows/box_catalog.yml, scripts/import_box_catalog.py, catalog-expansion/box-products.json]
permissions:
  contents: read
concurrency:
  group: obra-manager-product-catalog-expansion
  cancel-in-progress: false
jobs:
  boxes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/product-core.mjs && node tests/attributes-core.cjs && node tests/box-variants.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/library-browser.cjs && node tests/box-browser.cjs
      - run: pip install firebase-admin google-auth requests
      - run: python scripts/import_box_catalog.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: python scripts/publish_boxes.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-catalog-result
          path: |
            box-catalog-result.json
            box-update-before.json
            hosting-test/
          retention-days: 7
