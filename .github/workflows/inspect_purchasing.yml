name: Inspect purchasing catalog
on:
  push:
    branches: [feature/purchasing-costs-2026-10-09]
    paths: ['scripts/inspect_purchasing.py', '.github/workflows/inspect_purchasing.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-cloud-firestore
      - run: python scripts/inspect_purchasing.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
