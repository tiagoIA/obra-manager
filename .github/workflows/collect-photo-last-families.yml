name: Review remaining conduit and connector photos
on:
  push:
    branches: [feature/lista-guiada-v1]
    paths: [.github/workflows/collect-photo-last-families.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: python scripts/collect-photo-last-families.py
