<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{--bg:#171b20;--sur:#242a32;--sur2:#303844;--bdr:#46515f;--txt:#f5f7fa;--mut:#b2bdca;--elec:#efb13e;--ok:#5cdf9c}body{font-family:Arial;background:var(--bg);color:var(--txt);margin:0}button{cursor:pointer}</style></head><body><button id="launch">New list</button><div id="shopping"></div><script type="module">
import {installGuidedShopping} from './guided-shopping-v2.js';
import {installShoppingView} from './shopping-view-v3.js';
const materials=[{id:'connector',name:'EMT Connector 3/4 in.',cat:'eletrica',unit:'ea',brand:'Example',manufacturerPart:'C34',suppliers:[{name:'Home Depot',code:'123',price:2,priceDate:'2026-10-15'}],guidedUses:['ev'],photoUrl:'https://invalid.example/photo.jpg'},{id:'breaker',name:'Circuit Breaker 40A',cat:'eletrica',unit:'ea',brand:'Example',manufacturerPart:'B40',guidedUses:['ev']},{id:'inactive',name:'Inactive Connector',active:false,cat:'eletrica',unit:'ea'},{id:'cable',name:'Copper Cable',cat:'eletrica',unit:'ft',guidedUses:['ev']}];
let lists=[{id:'existing',name:'Existing purchase',projectId:'sample',guidedMode:'custom',done:false}],items=[{id:'bought',listId:'existing',matId:'breaker',name:'Circuit Breaker 40A',cat:'eletrica',unit:'ea',qty:2,bought:true,boughtAt:'10/14/2026',roomId:'room',roomName:'Basement'}],active='existing';window.saved=[];window.notices=[];window.draftWrites=[];lists.push(...JSON.parse(localStorage.getItem('fake-cloud-drafts')||'[]'));
const host={userId:()=> 'test-user',projectId:()=> 'sample',projects:()=>[{id:'sample',name:'Example project'}],materials:()=>materials,templates:()=>[],lists:()=>lists,list:id=>lists.find(l=>l.id===id),items:id=>items.filter(i=>i.listId===id),notify:(...a)=>window.notices.push(a),openMaterial:()=>{},saveMaterialUses:async()=>{},saveTemplate:async()=>{},saveDraft:async(id,payload,revision)=>{const old=lists.find(l=>l.id===id);if(old&&old.draftRevision!==revision)throw Error('Draft conflict');const record={id,name:payload.name||'Untitled shopping list',listType:'draft',ownerUid:'test-user',projectId:payload.projectId,draftPayload:JSON.parse(JSON.stringify(payload)),draftRevision:revision+1};lists=lists.filter(l=>l.id!==id).concat(record);localStorage.setItem('fake-cloud-drafts',JSON.stringify(lists.filter(l=>l.listType==='draft')));window.draftWrites.push(record);window.view?.render(document.querySelector('#shopping'));return {revision:revision+1};},openList:id=>{active=id;window.opened=id;},saveList:async draft=>{window.saved.push(JSON.parse(JSON.stringify(draft)));return draft.editId||'created';}};
installGuidedShopping(host);window.guided=window.guidedShopping;document.querySelector('#launch').onclick=()=>window.guided.launch();
window.view=installShoppingView({data:()=>({lists,items,materials,projects:host.projects(),rooms:[{id:'room',projectId:'sample',name:'Basement'}]}),active:()=>active,setActive:v=>active=v,create:()=>window.guided.launch(),customize:id=>window.guided.edit(id),notify:host.notify,template:()=>{},removeList:()=>{},removeItem:()=>{},toggleList:()=>{},toggleItem:()=>{},pdf:()=>{},quick:()=>{},saveStore:async()=>{}});window.view.render(document.querySelector('#shopping'));window.renderLists=()=>{active=null;window.view.render(document.querySelector('#shopping'));};window.ready=true;
</script></body></html>
