<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="background:#101b29;color:#eee;font-family:Arial"><button id="open">References</button><button id="task">Task</button><div id="task-host"></div><script type="module">
import {installReferences} from './installation-references.js';import {referenceStore} from './installation-reference-store.mjs';
const data=JSON.parse(localStorage.getItem('reference-fixture')||'{"installationReferences":{},"tasks":{"t":{"id":"t","name":"Install device","done":true,"photos":["https://example.com/field.jpg"],"materialId":"m1"}}}');let listener;const persist=()=>{localStorage.setItem('reference-fixture',JSON.stringify(data));listener?.(Object.entries(data.installationReferences).map(([id,g])=>({...g,id})));};let edit=true;const materials=[{id:'m1',name:'Exact device',manufacturerPart:'MODEL-1'},{id:'type1',isTask:true,name:'Install device'}];
const store=referenceStore({user:()=> 'fixture-user',canEdit:()=>edit,newId:()=> 'g'+Date.now(),transaction:async fn=>fn({get:async(k,id)=>structuredClone(data[k][id]||null),set:(k,id,v)=>{data[k][id]=v;persist();},update:(k,id,v)=>{Object.assign(data[k][id],v);persist();}})});
const api=installReferences({user:()=> 'fixture-user',canEdit:()=>edit,materials:()=>materials,task:id=>data.tasks[id],subscribe:(next)=>{listener=next;persist();return()=>listener=null;},save:store.save,link:store.link,notify:message=>window.lastMessage=message});api.connect();document.querySelector('#open').onclick=()=>api.open();document.querySelector('#task').onclick=()=>{document.querySelector('#task-host').replaceChildren();api.mountTask(document.querySelector('#task-host'),data.tasks.t);};window.ready=true;
</script></body></html>
