<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="background:#1a1c1e"><button id="open">Estimates</button><script type="module">
import {installEstimates} from '/public/estimates.js';
let records=[],failSave=false,fieldMode=new URLSearchParams(location.search).has('field');window.testData={records:()=>records,fail:v=>failSave=v};
const api=installEstimates({userId:()=> fieldMode?'test-supervisor':'test-owner',allowed:()=>true,financialAllowed:()=>!fieldMode,owners:async()=>[{id:'test-owner',name:'Company Owner'}],inbox:async()=>[],submit:async d=>({...d,status:'Submitted',revision:d.revision+1}),approve:async d=>({...d,status:'Approved',approvedBy:'test-owner',revision:d.revision+1}),projects:()=>[],notify:console.log,list:async()=>structuredClone(records),save:async d=>{if(failSave)throw Error('Permission denied');d.revision++;d.history.push({revision:d.revision,at:new Date().toISOString(),status:d.status});records=records.filter(x=>x.id!==d.id).concat(structuredClone(d));return d;},upload:async(id,f)=>({path:id+'/'+f.name,name:f.name,size:f.size,type:f.type}),readFile:async()=>new Blob(['test'])});document.getElementById('open').onclick=api.open;window.ready=true;
</script></body></html>
